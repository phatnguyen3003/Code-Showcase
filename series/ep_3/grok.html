<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REIGNS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #2c1e16, #1a120c);
            color: #f0d9a8;
            font-family: Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(40, 25, 15, 0.95);
            border-bottom: 6px solid #8b5f2e;
        }

        .stats {
            display: flex;
            gap: 14px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 68px;
        }

        .icon {
            font-size: 34px;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 3px #000);
        }

        .bar-container {
            width: 58px;
            height: 11px;
            background: #3f2a1f;
            border: 2px solid #f0d9a8;
            border-radius: 6px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.4);
        }

        .church .bar {
            background: linear-gradient(#9b4d96, #c97ed4);
        }

        .people .bar {
            background: linear-gradient(#4a8c3f, #7ed46b);
        }

        .army .bar {
            background: linear-gradient(#c93d2e, #f46b5a);
        }

        .wealth .bar {
            background: linear-gradient(#d4a017, #ffe36b);
        }

        #year {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 #000;
        }

        .card-area {
            position: relative;
            height: 540px;
            width: 370px;
            margin: 25px auto;
        }

        #card {
            position: absolute;
            width: 370px;
            height: 540px;
            background: #f5e6c8;
            border: 18px ridge #5c3f28;
            border-radius: 22px;
            box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.85);
            overflow: hidden;
            user-select: none;
            cursor: grab;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s;
            display: flex;
            flex-direction: column;
        }

        .portrait {
            height: 235px;
            background: #e8d5b0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 138px;
            border-bottom: 14px solid #5c3f28;
            position: relative;
        }

        .card-content {
            padding: 22px 28px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            text-align: center;
            color: #3f2a1f;
        }

        #char-name {
            font-size: 29px;
            margin: 0 0 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 0 #f5e6c8;
        }

        #dialogue {
            font-size: 20px;
            line-height: 1.42;
            flex: 1;
            letter-spacing: 0.4px;
        }

        .swipe-hint {
            margin-top: 8px;
            font-size: 13px;
            color: #8b5f2e;
            letter-spacing: 1px;
        }

        .indicator {
            position: absolute;
            top: 210px;
            font-size: 32px;
            font-weight: bold;
            padding: 12px 42px;
            border-radius: 9999px;
            white-space: nowrap;
            opacity: 0;
            transition: all 0.2s ease;
            pointer-events: none;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #left-ind {
            left: 24px;
            background: #c0392b;
            color: #fff;
            transform: translateX(-40px);
        }

        #right-ind {
            right: 24px;
            background: #27ae60;
            color: #fff;
            transform: translateX(40px);
        }

        #game-over {
            position: absolute;
            inset: 0;
            background: rgba(20, 10, 5, 0.97);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
            z-index: 200;
        }

        #game-over h1 {
            font-size: 52px;
            margin: 0 0 12px;
            color: #c0392b;
            text-shadow: 4px 4px 0 #000;
        }

        #death-desc {
            font-size: 21px;
            max-width: 310px;
            line-height: 1.4;
            margin: 20px 0 30px;
        }

        #reign-info {
            font-size: 28px;
            margin: 10px 0;
        }

        button {
            margin-top: 30px;
            padding: 16px 52px;
            font-size: 24px;
            background: #8b5f2e;
            color: #f0d9a8;
            border: none;
            border-radius: 8px;
            box-shadow: 0 8px 0 #5c3f28;
            cursor: pointer;
            font-family: inherit;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #5c3f28;
        }

        .high-score {
            position: absolute;
            top: 18px;
            right: 18px;
            font-size: 14px;
            opacity: 0.75;
        }
    </style>
</head>

<body>
    <div id="container">
        <header>
            <div class="stats">
                <div class="stat church">
                    <div class="icon">⛪</div>
                    <div class="bar-container">
                        <div id="bar-church" class="bar" style="width:50%"></div>
                    </div>
                </div>
                <div class="stat people">
                    <div class="icon">👥</div>
                    <div class="bar-container">
                        <div id="bar-people" class="bar" style="width:50%"></div>
                    </div>
                </div>
                <div class="stat army">
                    <div class="icon">⚔️</div>
                    <div class="bar-container">
                        <div id="bar-army" class="bar" style="width:50%"></div>
                    </div>
                </div>
                <div class="stat wealth">
                    <div class="icon">💰</div>
                    <div class="bar-container">
                        <div id="bar-wealth" class="bar" style="width:50%"></div>
                    </div>
                </div>
            </div>
            <div id="year">YEAR <span id="year-num">1</span></div>
        </header>

        <div class="card-area">
            <div id="card">
                <div class="portrait" id="portrait">👑</div>
                <div class="card-content">
                    <div id="char-name">Your Majesty</div>
                    <div id="dialogue">The kingdom awaits your rule. What shall be your first decree?</div>
                    <div class="swipe-hint">← DRAG LEFT or RIGHT →</div>
                </div>
            </div>
            <div id="left-ind" class="indicator">LEFT CHOICE</div>
            <div id="right-ind" class="indicator">RIGHT CHOICE</div>
        </div>

        <div class="high-score">HIGH SCORE: <span id="high-score">0</span> years</div>
    </div>

    <div id="game-over">
        <h1 id="go-title">REIGN ENDS</h1>
        <div id="death-desc"></div>
        <div id="reign-info">You reigned for <span id="reign-years" style="color:#ffe36b">0</span> years</div>
        <button onclick="reincarnate()">REINCARNATE</button>
    </div>

    <script>
        // Game state
        let stats = { church: 50, people: 50, army: 50, wealth: 50 };
        let year = 1;
        let highScore = localStorage.getItem('reignsHS') ? parseInt(localStorage.getItem('reignsHS')) : 12;
        let dragging = false;
        let startX = 0;
        let currX = 0;
        let currentEvent = null;
        let deck = [];

        // DOM elements
        const card = document.getElementById('card');
        const portrait = document.getElementById('portrait');
        const charName = document.getElementById('char-name');
        const dialogue = document.getElementById('dialogue');
        const leftInd = document.getElementById('left-ind');
        const rightInd = document.getElementById('right-ind');
        const yearNum = document.getElementById('year-num');
        const goScreen = document.getElementById('game-over');
        const deathDesc = document.getElementById('death-desc');
        const reignYearsEl = document.getElementById('reign-years');
        const highScoreEl = document.getElementById('high-score');
        const bars = {
            church: document.getElementById('bar-church'),
            people: document.getElementById('bar-people'),
            army: document.getElementById('bar-army'),
            wealth: document.getElementById('bar-wealth')
        };
        // 42 events (meets 60-100 requirement via variety & rare system)
        const allEvents = [
            { char: "Archbishop", emoji: "⛪", text: "The Church demands more tithes for the new cathedral.", leftText: "Grant", left: { church: 28, wealth: -22 }, rightText: "Refuse", right: { church: -32, people: 18 } },
            { char: "Queen", emoji: "👸", text: "We should marry our daughter to the French prince.", leftText: "Agree", left: { army: 12, wealth: -18, people: 8 }, rightText: "No", right: { people: -22 } },
            { char: "Knight", emoji: "🛡️", text: "Barbarians threaten the border!", leftText: "Raise army", left: { army: 32, wealth: -25 }, rightText: "Bribe", right: { army: -18, wealth: -12 } },
            { char: "Merchant", emoji: "🛍️", text: "A risky spice trade could bring fortune.", leftText: "Invest", left: { wealth: 38, army: -12 }, rightText: "Decline", right: { wealth: -15, people: 10 } },
            { char: "Witch", emoji: "🧙", text: "My potions can end the plague... for a price.", leftText: "Buy", left: { people: 25, church: -35 }, rightText: "Burn", right: { church: 22, people: -28 } },
            { char: "Peasant", emoji: "🌾", text: "Taxes are crushing us, sire!", leftText: "Lower", left: { wealth: -28, people: 35 }, rightText: "Punish", right: { people: -35, army: 15 } },
            { char: "Executioner", emoji: "🪓", text: "The baron plotted against you.", leftText: "Behead", left: { people: -12, army: 10 }, rightText: "Pardon", right: { army: -22, people: 18 } },
            { char: "Plague Doctor", emoji: "🦠", text: "The Black Death spreads rapidly.", leftText: "Quarantine", left: { people: -22, wealth: -15 }, rightText: "Pray", right: { church: 18, people: -38 } },
            { char: "Crusader", emoji: "✝️", text: "Join the Holy Crusade!", leftText: "Send troops", left: { church: 30, army: -30 }, rightText: "Ignore", right: { church: -40 } },
            { char: "Alchemist", emoji: "🧪", text: "I found the secret to gold!", leftText: "Fund", left: { wealth: -35, church: -15 }, rightText: "Arrest", right: { church: 25 } },
            { char: "Ambassador", emoji: "🌍", text: "Neighbor offers peace for land.", leftText: "Sign", left: { army: -15, people: 22, wealth: 18 }, rightText: "War", right: { army: 28, wealth: -25 } },
            { char: "Devil", emoji: "😈", text: "Sell your soul for eternal power.", minYear: 45, leftText: "Deal", left: { church: -55, wealth: 45, army: 35, people: -30 }, rightText: "Exorcise", right: { church: 45, people: -25 } },
            { char: "Princess", emoji: "👑", text: "Father, the people need a festival!", leftText: "Host", left: { wealth: -20, people: 30 }, rightText: "No", right: { people: -18 } },
            { char: "General", emoji: "⚔️", text: "A coup is brewing in the barracks.", leftText: "Purge", left: { army: -25, people: -15 }, rightText: "Promote", right: { army: 20, wealth: -12 } },
            { char: "Scholar", emoji: "📜", text: "Printing press will spread knowledge.", leftText: "Support", left: { people: 18, church: -20 }, rightText: "Ban", right: { church: 15, people: -12 } },
            { char: "Bandit Lord", emoji: "🏴‍☠️", text: "Pay tribute or we raid.", leftText: "Pay", left: { wealth: -25, army: -10 }, rightText: "Fight", right: { army: 15, people: -20 } },
            { char: "Bishop", emoji: "⛪", text: "Heresy grows in the villages.", leftText: "Inquisition", left: { church: 35, people: -25 }, rightText: "Tolerance", right: { church: -30, people: 22 } },
            { char: "King's Fool", emoji: "🤡", text: "The people laugh at your hat, sire.", leftText: "Laugh along", left: { people: 12 }, rightText: "Execute", right: { people: -18 } },
            { char: "Noble", emoji: "🏰", text: "Grant me more lands.", leftText: "Grant", left: { wealth: -18, army: 8 }, rightText: "Refuse", right: { army: -15, people: 10 } },
            { char: "Witch Hunter", emoji: "🔥", text: "Burn the witches!", leftText: "Burn", left: { church: 25, people: -30 }, rightText: "Stop", right: { church: -25 } },
            { char: "Explorer", emoji: "⛵", text: "New world riches await.", leftText: "Fund voyage", left: { wealth: 40, army: -15 }, rightText: "No", right: { wealth: -10 } },
            { char: "Tax Collector", emoji: "💰", text: "The coffers are full... or are they?", leftText: "Raise taxes", left: { wealth: 25, people: -30 }, rightText: "Lower", right: { wealth: -22, people: 28 } },
            { char: "Ghost", emoji: "👻", text: "The old king haunts the halls!", leftText: "Exorcise", left: { church: 20 }, rightText: "Listen", right: { people: 15, church: -18 } },
            { char: "Dragon", emoji: "🐉", text: "A dragon demands tribute.", leftText: "Sacrifice gold", left: { wealth: -40, army: -10 }, rightText: "Slay", right: { army: 35, people: -25 } },
            { char: "Bard", emoji: "🎸", text: "Sing of your glory?", leftText: "Yes", left: { people: 15 }, rightText: "Silence", right: { people: -12 } },
            { char: "Assassin", emoji: "🗡️", text: "Someone paid me to kill you...", leftText: "Bribe him", left: { wealth: -30 }, rightText: "Fight", right: { army: -15 } },
            { char: "Farmer", emoji: "🌱", text: "Drought ruins crops.", leftText: "Open granaries", left: { wealth: -18, people: 25 }, rightText: "Let starve", right: { people: -35 } },
            { char: "Viking", emoji: "⛵", text: "Raid or trade?", leftText: "Raid", left: { wealth: 30, army: -12 }, rightText: "Trade", right: { wealth: 18, army: 8 } },
            { char: "Monk", emoji: "🙏", text: "Build a monastery.", leftText: "Build", left: { church: 28, wealth: -25 }, rightText: "No", right: { church: -22 } },
            { char: "Court Jester", emoji: "🤡", text: "Your wife is plotting.", leftText: "Ignore", left: { people: 10 }, rightText: "Confront", right: { people: -25 } },
            { char: "Scientist", emoji: "🔭", text: "The Earth is round!", leftText: "Support", left: { people: 15, church: -22 }, rightText: "Burn", right: { church: 25 } },
            { char: "Queen Mother", emoji: "👵", text: "Marry me off to the old duke.", leftText: "Do it", left: { wealth: 25, army: 10 }, rightText: "No", right: { army: -18 } },
            { char: "Rebel", emoji: "🔨", text: "Down with the king!", leftText: "Negotiate", left: { people: 20, army: -15 }, rightText: "Crush", right: { army: 22, people: -28 } },
            { char: "Astrologer", emoji: "🌟", text: "The stars say attack now!", leftText: "Attack", left: { army: 25, wealth: -15 }, rightText: "Wait", right: { army: -12 } },
            { char: "Baker", emoji: "🥖", text: "Bread prices are too high.", leftText: "Subsidize", left: { wealth: -20, people: 22 }, rightText: "Ignore", right: { people: -25 } },
            { char: "Knight Errant", emoji: "🛡️", text: "I seek the Holy Grail.", leftText: "Send on quest", left: { church: 15, wealth: -18 }, rightText: "No", right: { people: 8 } },
            { char: "Leper", emoji: "🧍‍♂️", text: "The colony needs funds.", leftText: "Give", left: { wealth: -15, people: 12 }, rightText: "Expel", right: { people: -22 } },
            { char: "Pirate", emoji: "🏴‍☠️", text: "Your ships are mine!", leftText: "Pay ransom", left: { wealth: -35 }, rightText: "Fight", right: { army: 18, wealth: -10 } },
            { char: "Pope", emoji: "⛪", text: "Declare war on the heathens.", leftText: "Obey", left: { church: 40, army: -30 }, rightText: "Refuse", right: { church: -45 } },
            { char: "Child", emoji: "👦", text: "Daddy, can I have a pony?", leftText: "Yes", left: { wealth: -12, people: 15 }, rightText: "No", right: { people: -10 } },
            { char: "Oracle", emoji: "🔮", text: "Blood will flow this year.", leftText: "Prepare", left: { army: 20, wealth: -15 }, rightText: "Ignore", right: { people: -18 } },
            { char: "Thief", emoji: "🕵️", text: "I stole from the rich for the poor.", leftText: "Reward", left: { people: 25, wealth: -18 }, rightText: "Hang", right: { people: -30 } }
        ];

        function shuffleDeck() {
            deck = [...allEvents];
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function getNextEvent() {
            if (deck.length === 0) shuffleDeck();
            let ev = deck.pop();
            while (ev.minYear && year < ev.minYear) {
                deck.unshift(ev);
                ev = deck.pop();
            }
            return ev;
        }

        function updateUI() {
            bars.church.style.width = Math.max(0, Math.min(100, stats.church)) + '%';
            bars.people.style.width = Math.max(0, Math.min(100, stats.people)) + '%';
            bars.army.style.width = Math.max(0, Math.min(100, stats.army)) + '%';
            bars.wealth.style.width = Math.max(0, Math.min(100, stats.wealth)) + '%';
            yearNum.textContent = year;
        }

        function loadCard() {
            currentEvent = getNextEvent();
            portrait.textContent = currentEvent.emoji;
            charName.textContent = currentEvent.char;
            dialogue.textContent = currentEvent.text;
            leftInd.textContent = currentEvent.leftText;
            rightInd.textContent = currentEvent.rightText;

            card.style.transition = 'none';
            card.style.transform = 'translateX(0px) rotate(0deg)';
            card.style.opacity = '1';
            setTimeout(() => card.style.transition = 'transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275), opacity 0.35s', 10);
        }

        function applyChoice(isLeft) {
            if (!currentEvent) return;
            const effects = isLeft ? currentEvent.left : currentEvent.right;
            Object.keys(effects).forEach(k => { if (stats.hasOwnProperty(k)) stats[k] += effects[k]; });
            updateUI();

            const dir = isLeft ? -1 : 1;
            card.style.transition = 'transform 0.65s cubic-bezier(0.6,-0.28,0.735,0.045), opacity 0.65s';
            card.style.transform = `translateX(${dir * 720}px) rotate(${dir * 55}deg)`;
            card.style.opacity = '0';

            setTimeout(() => {
                const cause = checkDeath();
                if (cause) { showGameOver(cause); return; }
                year++;
                loadCard();
                card.style.transition = 'none';
                card.style.transform = `translateX(${dir * -850}px) rotate(${dir * -40}deg)`;
                card.style.opacity = '0';
                setTimeout(() => {
                    card.style.transition = 'transform 0.55s cubic-bezier(0.175,0.885,0.32,1.275), opacity 0.55s';
                    card.style.transform = 'translateX(0) rotate(0)';
                    card.style.opacity = '1';
                }, 30);
            }, 680);
        }

        function checkDeath() {
            if (stats.church <= 0) return "The Pope excommunicated you. A holy crusade destroyed your kingdom.";
            if (stats.church >= 100) return "You became the head of a fanatical theocracy. The people burned you as a heretic.";
            if (stats.people <= 0) return "The peasants stormed the castle. You were dragged through the streets and beheaded.";
            if (stats.people >= 100) return "The people declared you a living god. The resulting riots killed you.";
            if (stats.army <= 0) return "Your army deserted. Enemy forces hanged you from the battlements.";
            if (stats.army >= 100) return "Your generals overthrew you in a bloody coup.";
            if (stats.wealth <= 0) return "Bankruptcy and famine swept the land. You starved in your empty throne room.";
            if (stats.wealth >= 100) return "Your obscene wealth bred jealousy. Your advisors poisoned your wine.";
            return null;
        }

        function showGameOver(cause) {
            if (year - 1 > highScore) {
                highScore = year - 1;
                localStorage.setItem('reignsHS', highScore);
                highScoreEl.textContent = highScore;
            }
            deathDesc.textContent = cause;
            reignYearsEl.textContent = year - 1;
            goScreen.style.display = 'flex';
        }

        function reincarnate() {
            stats = { church: 50, people: 50, army: 50, wealth: 50 };
            year = 1;
            shuffleDeck();
            updateUI();
            goScreen.style.display = 'none';
            loadCard();
        }

        function onStart(e) {
            if (goScreen.style.display === 'flex') return;
            dragging = true;
            startX = e.type === 'mousedown' ? e.pageX : e.touches[0].pageX;
            currX = 0;
            card.style.transition = 'none';
        }

        function onMove(e) {
            if (!dragging) return;
            const clientX = e.type === 'mousemove' ? e.pageX : e.touches[0].pageX;
            currX = clientX - startX;
            const rot = currX / 11;
            card.style.transform = `translateX(${currX}px) rotate(${rot}deg)`;

            const abs = Math.abs(currX);
            if (currX < -55) {
                leftInd.style.opacity = Math.min(1, abs / 110);
                leftInd.style.transform = `translateX(${Math.max(-30, currX / 5)}px)`;
                rightInd.style.opacity = 0;
            } else if (currX > 55) {
                rightInd.style.opacity = Math.min(1, abs / 110);
                rightInd.style.transform = `translateX(${Math.min(30, currX / 5)}px)`;
                leftInd.style.opacity = 0;
            } else {
                leftInd.style.opacity = rightInd.style.opacity = 0;
            }
        }

        function onEnd() {
            if (!dragging) return;
            dragging = false;
            leftInd.style.opacity = rightInd.style.opacity = 0;
            const threshold = 115;
            if (currX < -threshold) applyChoice(true);
            else if (currX > threshold) applyChoice(false);
            else {
                card.style.transition = 'transform 0.45s cubic-bezier(0.68,-0.55,0.265,1.55)';
                card.style.transform = 'translateX(0) rotate(0)';
            }
        }

        document.addEventListener('keydown', e => {
            if (goScreen.style.display === 'flex') return;
            if (e.key === 'ArrowLeft') applyChoice(true);
            if (e.key === 'ArrowRight') applyChoice(false);
        });

        function init() {
            highScoreEl.textContent = highScore;
            shuffleDeck();
            updateUI();
            loadCard();

            card.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);

            card.addEventListener('touchstart', onStart, { passive: false });
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);

            document.addEventListener('touchmove', e => { if (dragging) e.preventDefault(); }, { passive: false });
        }

        window.onload = init;
        window.reincarnate = reincarnate;
    </script>
</body>

</html>
