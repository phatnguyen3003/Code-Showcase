<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kingdom's Burden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0d0a1a;
            --card-bg: #1e1530;
            --card-border: #5a3d8a;
            --gold: #c8a44a;
            --gold-dim: #7a6030;
            --text: #e8d5a8;
            --text-dim: #8a7055;
            --red: #c04040;
            --green: #40a060;
            --purple: #7040b0;
            --church: #b090d0;
            --people: #70c090;
            --military: #c07060;
            --wealth: #c0a040;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Georgia, 'Times New Roman', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(90, 40, 140, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(60, 20, 100, 0.2) 0%, transparent 50%);
            pointer-events: none;
        }

        /* TITLE SCREEN */
        #title-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            text-align: center;
            padding: 20px;
            background: radial-gradient(ellipse at 50% 30%, rgba(100, 50, 160, 0.4) 0%, transparent 70%);
        }

        #title-screen h1 {
            font-size: clamp(32px, 8vw, 52px);
            color: var(--gold);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(200, 164, 74, 0.6), 0 0 60px rgba(200, 164, 74, 0.2);
        }

        .title-sub {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-style: italic;
        }

        .title-hs {
            font-size: 12px;
            color: var(--gold-dim);
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .title-crown {
            font-size: 52px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(200, 164, 74, 0.5));
        }

        .ornament {
            color: var(--gold-dim);
            font-size: 18px;
            letter-spacing: 8px;
            margin-bottom: 30px;
        }

        .hint-text {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 20px;
            font-style: italic;
        }

        #start-btn {
            background: linear-gradient(135deg, #3d1a60, #6030a0);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 14px 44px;
            color: var(--text);
            font-size: 15px;
            font-family: Georgia, serif;
            cursor: pointer;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(80, 40, 150, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        #start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(80, 40, 150, 0.6);
        }

        /* STATS BAR */
        #stats-bar {
            width: 100%;
            max-width: 380px;
            display: flex;
            gap: 6px;
            padding: 12px 14px 8px;
            z-index: 10;
        }

        .stat-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .stat-icon-wrap {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-track {
            width: 100%;
            height: 7px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .stat-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 2px;
        }

        .stat-church .stat-fill {
            background: linear-gradient(90deg, #8060b0, var(--church));
        }

        .stat-people .stat-fill {
            background: linear-gradient(90deg, #40906a, var(--people));
        }

        .stat-military .stat-fill {
            background: linear-gradient(90deg, #904040, var(--military));
        }

        .stat-wealth .stat-fill {
            background: linear-gradient(90deg, #907030, var(--wealth));
        }

        .stat-track::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.06) 50%, transparent 100%);
        }

        /* YEAR */
        #year-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 2px 0 6px;
        }

        .year-divider {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        /* CHOICE INDICATORS */
        #indicators {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            padding: 0 14px;
            height: 32px;
            align-items: center;
            margin-bottom: 4px;
        }

        .indicator {
            font-size: 11px;
            font-style: italic;
            opacity: 0;
            transition: opacity 0.08s;
            max-width: 44%;
            line-height: 1.3;
        }

        #ind-left {
            color: #e08080;
            text-align: left;
        }

        #ind-right {
            color: #80d0a0;
            text-align: right;
        }

        /* CARD AREA */
        #card-stage {
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            position: relative;
            padding: 0 14px 8px;
        }

        #card-wrap {
            position: relative;
            width: 260px;
            height: 360px;
        }

        /* Shadow card behind */
        #card-shadow {
            position: absolute;
            inset: 4px -4px -4px 4px;
            background: #0a0814;
            border-radius: 14px;
            border: 1px solid rgba(90, 61, 138, 0.3);
        }

        #card {
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, #1e1530 0%, #150e28 60%, #1a1030 100%);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transform-origin: center 110%;
            will-change: transform;
            cursor: grab;
        }

        #card:active {
            cursor: grabbing;
        }

        #card-glow {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            opacity: 0;
            transition: opacity 0.06s;
            pointer-events: none;
            z-index: 5;
        }

        /* Portrait */
        #portrait-wrap {
            width: 100%;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        #portrait-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 80%, rgba(90, 61, 138, 0.3) 0%, transparent 70%);
        }

        #portrait-wrap::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, rgba(30, 21, 48, 0.8));
        }

        #portrait-svg {
            width: 130px;
            height: 170px;
            position: relative;
            z-index: 1;
        }

        /* Card content */
        #char-name {
            font-size: 11px;
            color: var(--purple);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 10px 0 4px;
            padding: 0 16px;
        }

        #dialogue {
            font-size: 13px;
            line-height: 1.6;
            color: #d0b880;
            padding: 0 18px 10px;
            text-align: center;
            flex: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        /* Effects preview */
        #effects-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            padding: 0 10px 10px;
            opacity: 0;
            transition: opacity 0.12s;
            min-height: 22px;
            flex-wrap: wrap;
        }

        .eff-chip {
            font-size: 10px;
            padding: 2px 9px;
            border-radius: 10px;
            border: 1px solid;
            letter-spacing: 0.5px;
        }

        .eff-pos {
            color: #80d090;
            border-color: rgba(80, 200, 120, 0.3);
            background: rgba(80, 200, 120, 0.08);
        }

        .eff-neg {
            color: #e08080;
            border-color: rgba(220, 80, 80, 0.3);
            background: rgba(220, 80, 80, 0.08);
        }

        /* Bottom hint */
        #swipe-hint {
            font-size: 10px;
            color: rgba(90, 61, 138, 0.6);
            letter-spacing: 2px;
            text-align: center;
            padding-bottom: 8px;
            text-transform: uppercase;
        }

        /* GAME OVER */
        #game-over {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background: radial-gradient(ellipse at 50% 40%, rgba(80, 20, 20, 0.6) 0%, rgba(10, 5, 20, 0.98) 60%);
        }

        .go-crown {
            font-size: 40px;
            margin-bottom: 16px;
        }

        #go-title {
            font-size: clamp(22px, 6vw, 32px);
            color: var(--gold);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        #go-cause {
            font-size: 14px;
            color: #c07060;
            margin-bottom: 24px;
            max-width: 300px;
            line-height: 1.6;
            font-style: italic;
        }

        .go-divider {
            width: 60px;
            height: 1px;
            background: var(--gold-dim);
            margin: 0 auto 20px;
        }

        #go-years {
            font-size: 18px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        #go-hs {
            font-size: 13px;
            color: var(--gold-dim);
            margin-bottom: 32px;
        }

        #go-epitaph {
            font-size: 12px;
            color: rgba(150, 120, 80, 0.6);
            margin-bottom: 28px;
            max-width: 260px;
            font-style: italic;
            line-height: 1.5;
        }

        #reincarnate-btn {
            background: linear-gradient(135deg, #3d1a60, #6030a0);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 13px 36px;
            color: var(--text);
            font-size: 14px;
            font-family: Georgia, serif;
            cursor: pointer;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(80, 40, 150, 0.4);
            transition: all 0.2s;
        }

        #reincarnate-btn:hover {
            transform: translateY(-2px);
        }

        .new-hs-badge {
            display: none;
            font-size: 11px;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Stat warning flash */
        @keyframes statFlash {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        .stat-warn {
            animation: statFlash 0.4s ease 3;
        }

        /* Card fly animation */
        @keyframes cardFlyLeft {
            to {
                transform: translateX(-130%) rotate(-25deg);
                opacity: 0;
            }
        }

        @keyframes cardFlyRight {
            to {
                transform: translateX(130%) rotate(25deg);
                opacity: 0;
            }
        }

        @keyframes cardEnter {
            from {
                transform: translateY(30px) scale(0.92);
                opacity: 0;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        .fly-left {
            animation: cardFlyLeft 0.38s ease-in forwards;
        }

        .fly-right {
            animation: cardFlyRight 0.38s ease-in forwards;
        }

        .card-enter {
            animation: cardEnter 0.35s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }

        /* Responsive */
        @media(max-height:680px) {
            #portrait-wrap {
                height: 155px;
            }

            #card-wrap {
                height: 320px;
            }

            #dialogue {
                font-size: 12px;
            }
        }

        @media(max-width:320px) {
            #card-wrap {
                width: 230px;
            }
        }
    </style>
</head>

<body>

    <!-- TITLE SCREEN -->
    <div id="title-screen">
        <div class="title-crown">♛</div>
        <h1>Kingdom's Burden</h1>
        <div class="title-sub">A game of power &amp; consequence</div>
        <div class="ornament">✦ ✦ ✦</div>
        <div class="title-hs" id="title-hs"></div>
        <button id="start-btn" onclick="startGame()">Ascend the Throne</button>
        <div class="hint-text">Drag the card left or right to decide the fate of your realm</div>
    </div>

    <!-- GAME UI -->
    <div id="stats-bar">
        <div class="stat-item stat-church">
            <div class="stat-icon-wrap">
                <svg viewBox="0 0 22 22" width="22" height="22">
                    <rect x="9" y="1" width="4" height="20" rx="1" fill="var(--church)" />
                    <rect x="2" y="7" width="18" height="4" rx="1" fill="var(--church)" />
                    <rect x="8" y="14" width="6" height="7" rx="1" fill="var(--church)" opacity="0.7" />
                </svg>
            </div>
            <div class="stat-track">
                <div class="stat-fill" id="fill-church" style="width:50%"></div>
            </div>
        </div>
        <div class="stat-item stat-people">
            <div class="stat-icon-wrap">
                <svg viewBox="0 0 22 22" width="22" height="22">
                    <circle cx="11" cy="6" r="4" fill="var(--people)" />
                    <path d="M3 20 Q3 13 11 13 Q19 13 19 20Z" fill="var(--people)" />
                </svg>
            </div>
            <div class="stat-track">
                <div class="stat-fill" id="fill-people" style="width:50%"></div>
            </div>
        </div>
        <div class="stat-item stat-military">
            <div class="stat-icon-wrap">
                <svg viewBox="0 0 22 22" width="22" height="22">
                    <path d="M11 2 L14 8 L20 8 L15 13 L17 20 L11 16 L5 20 L7 13 L2 8 L8 8Z" fill="none"
                        stroke="var(--military)" stroke-width="1.5" opacity="0.4" />
                    <rect x="10" y="1" width="2" height="16" rx="1" fill="var(--military)" />
                    <path d="M7 12 L15 12 L13 17 L11 15 L9 17Z" fill="var(--military)" />
                    <ellipse cx="11" cy="1" rx="3" ry="2" fill="var(--military)" />
                </svg>
            </div>
            <div class="stat-track">
                <div class="stat-fill" id="fill-military" style="width:50%"></div>
            </div>
        </div>
        <div class="stat-item stat-wealth">
            <div class="stat-icon-wrap">
                <svg viewBox="0 0 22 22" width="22" height="22">
                    <circle cx="11" cy="11" r="9" fill="none" stroke="var(--wealth)" stroke-width="1.5" />
                    <circle cx="11" cy="11" r="6" fill="none" stroke="var(--wealth)" stroke-width="1" opacity="0.4" />
                    <text x="11" y="15" text-anchor="middle" fill="var(--wealth)" font-size="9"
                        font-weight="bold">₵</text>
                </svg>
            </div>
            <div class="stat-track">
                <div class="stat-fill" id="fill-wealth" style="width:50%"></div>
            </div>
        </div>
    </div>

    <div id="year-bar">
        <div class="year-divider"></div>
        <span id="year-text">Year I</span>
        <div class="year-divider"></div>
    </div>

    <div id="indicators">
        <div class="indicator" id="ind-left"></div>
        <div class="indicator" id="ind-right"></div>
    </div>

    <div id="card-stage">
        <div id="card-wrap">
            <div id="card-shadow"></div>
            <div id="card">
                <div id="card-glow"></div>
                <div id="portrait-wrap">
                    <div id="portrait-svg"></div>
                </div>
                <div id="char-name">—</div>
                <div id="dialogue"></div>
                <div id="effects-row"></div>
            </div>
        </div>
    </div>

    <div id="swipe-hint">← swipe to decide →</div>

    <!-- GAME OVER -->
    <div id="game-over">
        <div class="go-crown">☠</div>
        <div id="go-title">Your Reign Has Ended</div>
        <div id="go-cause"></div>
        <div class="go-divider"></div>
        <div id="go-years"></div>
        <div id="go-hs"></div>
        <div class="new-hs-badge" id="new-hs-badge">✦ New Record ✦</div>
        <div id="go-epitaph"></div>
        <button id="reincarnate-btn" onclick="reincarnate()">Reincarnate</button>
    </div>

                text: '"The prisons are overflowing. Many prisoners are there for small debts. Release them or expand the prison?"',
                left: { text: 'Release the debtors', effects: { church: 8, people: 14, military: -5, wealth: -6 } },
                right: { text: 'Expand the prison', effects: { church: -8, people: -12, military: 10, wealth: -10 } }
            },
            {
                id: 'g13', portrait: 'general', name: 'Border Patrol Chief Kira',
                text: '"Refugees flee to us from war-torn lands. Thousands at the gates. Let them in or turn them away?"',
                left: { text: 'Close the borders', effects: { church: -12, people: -8, military: 8, wealth: 5 } },
                right: { text: 'Open the gates', effects: { church: 10, people: 16, military: -10, wealth: -12 } }
            },
            {
                id: 'g14', portrait: 'witch', name: 'Seer Yenna',
                text: '"The stars foretell a great storm in three days. We should move the royal grain — or it is all lost."',
                left: { text: 'Ignore the seer\'s warning', effects: { church: 8, people: -14, military: 0, wealth: -14 } },
                right: { text: 'Move the grain immediately', effects: { church: -8, people: 12, military: 0, wealth: 10 } }
            },
            {
                id: 'g15', portrait: 'merchant', name: 'Guild Master Petra',
                text: '"A new tax on luxury goods would fund the army — but infuriate the nobility."',
                left: { text: 'Leave luxury untaxed', effects: { church: 0, people: 5, military: -8, wealth: 0 } },
                right: { text: 'Tax luxury goods', effects: { church: 0, people: -10, military: 10, wealth: 12 } }
            },

            // ── RARE EVENTS (minYear requirements) ──
            {
                id: 'rare1', portrait: 'witch', name: 'The Devil at Crossroads',
                text: '"Ah, the great King. You have ruled long — but your time grows short. Let us make a deal, you and I."',
                left: { text: 'Banish the Devil', effects: { church: 24, people: 5, military: 5, wealth: 0 } },
                right: { text: 'Hear his offer', effects: { church: -24, people: 0, military: 14, wealth: 22 } },
                minYear: 50
            },
            {
                id: 'rare2', portrait: 'bishop', name: 'A Vision of Fire',
                text: '"In blinding light, an angel appeared to the King in the night. It spoke: \'Choose wisdom or glory.\'"',
                left: { text: 'Choose wisdom', effects: { church: 18, people: 18, military: -5, wealth: -5 } },
                right: { text: 'Choose glory', effects: { church: 5, people: -10, military: 24, wealth: 16 } },
                minYear: 40
            },
            {
                id: 'rare3', portrait: 'merchant', name: 'A Stranger from the Future',
                text: '"I know how this kingdom ends. I have seen it. Let me whisper its fate — for a price."',
                left: { text: 'Refuse the stranger', effects: { church: 8, people: 0, military: 0, wealth: 0 } },
                right: { text: 'Pay and hear the truth', effects: { church: -8, people: 5, military: 5, wealth: -14 } },
                minYear: 60
            },
            {
                id: 'rare4', portrait: 'bishop', name: 'The Plague of Locusts',
                text: '"Clouds of locusts blacken the sky, devouring every crop. It is the wrath of Heaven itself."',
                left: { text: 'Order emergency rationing', effects: { church: 8, people: -18, military: -8, wealth: -16 } },
                right: { text: 'Open foreign trade for grain', effects: { church: -10, people: 10, military: 0, wealth: -20 } },
                minYear: 30
            },
            {
                id: 'rare5', portrait: 'queen', name: 'The Philosopher Queen',
                text: '"After forty years, the Queen speaks: \'The kingdom suffers because you have not listened. Listen now.\'"',
                left: { text: 'Dismiss her counsel', effects: { church: -5, people: -10, military: -5, wealth: -5 } },
                right: { text: 'Heed her wisdom', effects: { church: 10, people: 15, military: 10, wealth: 10 } },
                minYear: 45
            },
        ];

        // ═══════════════════════════════════════════════════════════════
        // GAME OVER CONDITIONS
        // ═══════════════════════════════════════════════════════════════
        const GAME_OVERS = {
            church_low: {
                title: 'Excommunicated!',
                cause: 'The Pope declared you a heretic. The bishops fled, the people turned on you, and the Inquisition arrived at your gates.',
                epitaph: 'Here lies a king who forgot that God watches all thrones.'
            },
            church_high: {
                title: 'Holy Tyranny!',
                cause: 'Zealots consumed with divine fervor burned the kingdom in God\'s name. The Church had become the true ruler — and it burned everything.',
                epitaph: 'He who serves Heaven too absolutely serves no earthly realm.'
            },
            people_low: {
                title: 'The People\'s Revolt!',
                cause: 'The starving masses stormed the castle with torches and scythes. The last thing you heard was their righteous fury.',
                epitaph: 'No crown is heavier than the resentment of ten thousand hungry souls.'
            },
            people_high: {
                title: 'Overthrown by Joy!',
                cause: 'The people loved you too well. A demagogue promised them even more, and they crowned him their "People\'s King" — sending you to exile.',
                epitaph: 'Too loved to lead, too popular to rule.'
            },
            military_low: {
                title: 'Conquered!',
                cause: 'Without an army, neighboring kings carved your kingdom like a feast day roast. You surrendered in a week.',
                epitaph: 'A king without swords is just a man in a fancy chair.'
            },
            military_high: {
                title: 'The Generals\' Coup!',
                cause: 'The army had grown too powerful. The generals met in secret, declared your reign ended, and installed a military council.',
                epitaph: 'He built an army that no longer needed him.'
            },
            wealth_low: {
                title: 'Bankruptcy!',
                cause: 'The treasury was empty. Soldiers went unpaid and left. Merchants fled. The kingdom collapsed into ruin and debt.',
                epitaph: 'Even kings cannot eat promises.'
            },
            wealth_high: {
                title: 'Drowned in Gold!',
                cause: 'Corruption festered in every corner of a kingdom drowning in excess. The nobles poisoned each other and then came for you.',
                epitaph: 'There is no comfort in a throne buried under coins.'
            }
        };

        const EPITAPHS = [
            'He ruled with iron, and was buried in it.',
            'History remembers the crown, not the man beneath it.',
            'Three wars, two plagues, one throne — and then silence.',
            'He meant well, mostly.',
            'The people wept. Some of them.',
            'His reign was brief. His legend, briefer.',
            'He balanced the books. The books did not save him.',
            'God was watching. He always is.',
            'The next king was worse.',
            'The next king was better. They never mention this one.'
        ];

        // ═══════════════════════════════════════════════════════════════
        // GAME STATE
        // ═══════════════════════════════════════════════════════════════
        const state = {
            stats: { church: 50, people: 50, military: 50, wealth: 50 },
            year: 1,
            queue: [],
            currentEvent: null,
            kingNum: 1,
            dead: false
        };

        function toRoman(n) {
            const vals = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1];
            const syms = ['M', 'CM', 'D', 'CD', 'C', 'XC', 'L', 'XL', 'X', 'IX', 'V', 'IV', 'I'];
            let r = '';
            for (let i = 0; i < vals.length; i++) { while (n >= vals[i]) { r += syms[i]; n -= vals[i]; } }
            return r;
        }

        // ═══════════════════════════════════════════════════════════════
        // DRAG / SWIPE LOGIC
        // ═══════════════════════════════════════════════════════════════
        const card = document.getElementById('card');
        const cardGlow = document.getElementById('card-glow');
        const indLeft = document.getElementById('ind-left');
        const indRight = document.getElementById('ind-right');
        const effectsRow = document.getElementById('effects-row');

        let drag = { active: false, startX: 0, startY: 0, dx: 0, raf: null, locked: false };

        function onDragStart(e) {
            if (drag.locked || state.dead) return;
            drag.active = true;
            drag.startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            drag.startY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            drag.dx = 0;
            card.style.transition = 'none';
        }
        function onDragMove(e) {
            if (!drag.active) return;
            const cx = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const cy = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            const ddx = cx - drag.startX;
            const ddy = cy - drag.startY;
            if (Math.abs(ddy) > Math.abs(ddx) + 15 && Math.abs(ddx) < 20) { drag.active = false; snapBack(); return; }
            drag.dx = ddx;
            if (drag.raf) cancelAnimationFrame(drag.raf);
            drag.raf = requestAnimationFrame(animateCard);
        }
        function onDragEnd(e) {
            if (!drag.active) return;
            drag.active = false;
            if (drag.dx < -90) triggerChoice('left');
            else if (drag.dx > 90) triggerChoice('right');
            else snapBack();
        }

        function animateCard() {
            const dx = drag.dx;
            const rot = dx * 0.06;
            card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
            const abs = Math.abs(dx);
            const t = Math.min(abs / 110, 1);
            if (abs > 18) {
                const alpha = t * 0.55;
                if (dx < 0) {
                    cardGlow.style.background = `rgba(200,60,60,${alpha})`;
                    indLeft.style.opacity = Math.min(abs / 70, 1);
                    indRight.style.opacity = 0;
                } else {
                    cardGlow.style.background = `rgba(60,180,100,${alpha})`;
                    indRight.style.opacity = Math.min(abs / 70, 1);
                    indLeft.style.opacity = 0;
                }
                cardGlow.style.opacity = 1;
                effectsRow.style.opacity = Math.min(abs / 70, 1);
            } else {
                cardGlow.style.opacity = 0;
                indLeft.style.opacity = 0;
                indRight.style.opacity = 0;
                effectsRow.style.opacity = 0;
            }
        }

        function snapBack() {
            drag.dx = 0;
            card.style.transition = 'transform 0.32s cubic-bezier(0.2,1,0.3,1)';
            card.style.transform = 'none';
            cardGlow.style.opacity = 0;
            indLeft.style.opacity = 0;
            indRight.style.opacity = 0;
            effectsRow.style.opacity = 0;
        }

        card.addEventListener('mousedown', onDragStart);
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('mouseup', onDragEnd);
        card.addEventListener('touchstart', onDragStart, { passive: true });
        window.addEventListener('touchmove', onDragMove, { passive: false });
        window.addEventListener('touchend', onDragEnd);

        window.addEventListener('touchmove', e => { if (drag.active) e.preventDefault(); }, { passive: false });

        // ═══════════════════════════════════════════════════════════════
        // CARD DISPLAY
        // ═══════════════════════════════════════════════════════════════
        function buildEffectChips(effects, direction) {
            const ev = state.currentEvent;
            const choice = ev[direction];
            effectsRow.innerHTML = '';
            for (const [k, v] of Object.entries(choice.effects)) {
                const chip = document.createElement('span');
                chip.className = 'eff-chip ' + (v > 0 ? 'eff-pos' : 'eff-neg');
                const icons = { church: '✝', people: '♟', military: '⚔', wealth: '⁂' };
                chip.textContent = `${icons[k]} ${v > 0 ? '+' : ''}${v}`;
                effectsRow.appendChild(chip);
            }
        }

        function showCard(ev) {
            state.currentEvent = ev;
            // Reset card state
            drag.locked = false;
            card.style.transition = 'none';
            card.style.transform = 'none';
            cardGlow.style.opacity = 0;
            indLeft.style.opacity = 0;
            indRight.style.opacity = 0;
            effectsRow.style.opacity = 0;

            document.getElementById('portrait-svg').innerHTML = getPortrait(ev.portrait);
            document.getElementById('char-name').textContent = ev.name;
            document.getElementById('dialogue').textContent = ev.text;
            indLeft.textContent = '← ' + ev.left.text;
            indRight.textContent = ev.right.text + ' →';

            // Build effect chips for both sides (show on drag)
            // pre-render left, swap on direction
            effectsRow.innerHTML = '';

            card.classList.remove('fly-left', 'fly-right', 'card-enter');
            void card.offsetWidth;
            card.classList.add('card-enter');
        }

        function pickNextEvent() {
            // Filter eligible events
            const pool = EVENTS.filter(e => {
                if (e.minYear && state.year < e.minYear) return false;
                return true;
            });
            // Avoid repeating last 5
            const recent = state.queue.slice(-5).map(e => e.id);
            const fresh = pool.filter(e => !recent.includes(e.id));
            const candidates = fresh.length > 0 ? fresh : pool;
            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        // ═══════════════════════════════════════════════════════════════
        // CHOICE HANDLING
        // ═══════════════════════════════════════════════════════════════
        function triggerChoice(direction) {
            if (drag.locked) return;
            drag.locked = true;
            const ev = state.currentEvent;
            const choice = direction === 'left' ? ev.left : ev.right;

            // Animate effects preview
            effectsRow.innerHTML = '';
            for (const [k, v] of Object.entries(choice.effects)) {
                const chip = document.createElement('span');
                chip.className = 'eff-chip ' + (v > 0 ? 'eff-pos' : 'eff-neg');
                const icons = { church: '✝', people: '♟', military: '⚔', wealth: '⁂' };
                chip.textContent = `${icons[k]} ${v > 0 ? '+' : ''}${v}`;
                effectsRow.appendChild(chip);
            }
            effectsRow.style.opacity = 1;

            // Fly card off screen
            card.style.transition = 'transform 0.38s ease-in, opacity 0.38s ease-in';
            const targetX = direction === 'left' ? -440 : 440;
            const targetR = direction === 'left' ? -22 : 22;
            card.style.transform = `translateX(${targetX}px) rotate(${targetR}deg)`;

            setTimeout(() => {
                applyEffects(choice.effects);
                state.year++;
                state.queue.push(ev);
                updateYearDisplay();
                const gameOverKey = checkGameOver();
                if (gameOverKey) {
                    setTimeout(() => showGameOver(gameOverKey), 200);
                } else {
                    const next = pickNextEvent();
                    showCard(next);
                }
            }, 400);
        }

        function applyEffects(effects) {
            for (const [k, v] of Object.entries(effects)) {
                state.stats[k] = Math.max(0, Math.min(100, state.stats[k] + v));
            }
            updateStatBars();
        }

        function checkGameOver() {
            const s = state.stats;
            if (s.church <= 0) return 'church_low';
            if (s.church >= 100) return 'church_high';
            if (s.people <= 0) return 'people_low';
            if (s.people >= 100) return 'people_high';
            if (s.military <= 0) return 'military_low';
            if (s.military >= 100) return 'military_high';
            if (s.wealth <= 0) return 'wealth_low';
            if (s.wealth >= 100) return 'wealth_high';
            return null;
        }

        // ═══════════════════════════════════════════════════════════════
        // STAT BARS
        // ═══════════════════════════════════════════════════════════════
        function updateStatBars() {
            const keys = ['church', 'people', 'military', 'wealth'];
            keys.forEach(k => {
                const fill = document.getElementById('fill-' + k);
                const pct = state.stats[k];
                fill.style.width = pct + '%';
                // Warn on extremes
                if (pct < 15 || pct > 85) {
                    fill.parentElement.parentElement.classList.add('stat-warn');
                    setTimeout(() => fill.parentElement.parentElement.classList.remove('stat-warn'), 1500);
                }
            });
        }

        function updateYearDisplay() {
            document.getElementById('year-text').textContent = 'Year ' + toRoman(state.year);
        }

        // ═══════════════════════════════════════════════════════════════
        // GAME OVER SCREEN
        // ═══════════════════════════════════════════════════════════════
        function showGameOver(key) {
            state.dead = true;
            drag.locked = true;
            const go = GAME_OVERS[key];
            const years = state.year - 1;

            let hs = parseInt(localStorage.getItem('kb_highscore') || '0');
            const isNew = years > hs;
            if (isNew) {
                hs = years;
                localStorage.setItem('kb_highscore', '' + hs);
            }

            const goScreen = document.getElementById('game-over');
            document.getElementById('go-title').textContent = go.title;
            document.getElementById('go-cause').textContent = go.cause;
            document.getElementById('go-years').textContent = `King ${toRoman(state.kingNum)} • Reigned ${years} year${years !== 1 ? 's' : ''}`;
            document.getElementById('go-hs').textContent = `Longest Reign: ${hs} year${hs !== 1 ? 's' : ''}`;
            document.getElementById('new-hs-badge').style.display = isNew ? 'block' : 'none';
            document.getElementById('go-epitaph').textContent = '❝ ' + EPITAPHS[Math.floor(Math.random() * EPITAPHS.length)] + ' ❞';

            goScreen.style.display = 'flex';
            goScreen.style.opacity = '0';
            requestAnimationFrame(() => {
                goScreen.style.transition = 'opacity 0.6s ease';
                goScreen.style.opacity = '1';
            });
        }

        function reincarnate() {
            state.stats = { church: 50, people: 50, military: 50, wealth: 50 };
            state.year = 1;
            state.queue = [];
            state.dead = false;
            state.kingNum++;
            drag.locked = false;

            const goScreen = document.getElementById('game-over');
            goScreen.style.transition = 'opacity 0.4s ease';
            goScreen.style.opacity = '0';
            setTimeout(() => { goScreen.style.display = 'none'; }, 400);

            updateStatBars();
            updateYearDisplay();
            showCard(pickNextEvent());
        }

        // ═══════════════════════════════════════════════════════════════
        // START
        // ═══════════════════════════════════════════════════════════════
        function startGame() {
            const hs = parseInt(localStorage.getItem('kb_highscore') || '0');
            const titleScreen = document.getElementById('title-screen');
            titleScreen.style.transition = 'opacity 0.5s ease';
            titleScreen.style.opacity = '0';
            setTimeout(() => { titleScreen.style.display = 'none'; }, 500);

            updateStatBars();
            updateYearDisplay();
            showCard(pickNextEvent());
        }

        // Init title high score
        (function () {
            const hs = parseInt(localStorage.getItem('kb_highscore') || '0');
            const el = document.getElementById('title-hs');
            if (hs > 0) el.textContent = '⟡ Longest Reign: ' + hs + ' years ⟡';
        })();

        // Keyboard support
        window.addEventListener('keydown', e => {
            if (state.dead || drag.locked) return;
            if (e.key === 'ArrowLeft') triggerChoice('left');
            if (e.key === 'ArrowRight') triggerChoice('right');
        });
    </script>
