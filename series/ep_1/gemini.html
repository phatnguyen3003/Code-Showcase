<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Stick RTS – Turbo Edition</title>
    <style>
        html,
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
            margin: auto;
            border-bottom: 5px solid #222;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            max-width: 100%;
            height: auto;
        }

        #ui {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            border: 2px solid #444;
        }

        .stat {
            font-weight: bold;
            color: #ffd700;
            margin-right: 15px;
            font-size: 1.2rem;
            min-width: 100px;
        }

        button {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #444;
            transform: translateY(-3px);
            border-color: #ffd700;
        }

        #game-over-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <canvas id="c" width="1200" height="650"></canvas>
    <div id="ui">
        <div class="stat" id="gold">Gold: 0</div>
        <button onclick="spawn('miner')">Miner<br><span>30</span></button>
        <button onclick="spawn('light')">Light<br><span>40</span></button>
        <button onclick="spawn('heavy')">Heavy<br><span>80</span></button>
        <button onclick="spawn('ranged')">Ranged<br><span>60</span></button>
        <button onclick="spawn('mage')">Mage<br><span>120</span></button>
    </div>
    <div id="game-over-screen">
        <h1 id="result-title" style="font-size: 5rem;"></h1>
        <button onclick="resetGame()" style="font-size: 2rem;">PLAY AGAIN</button>
    </div>

    <script>
        const c = document.getElementById("c"), ctx = c.getContext("2d");
        const GROUND = () => c.height * 0.75;
        const TYPES = {
            miner: { cost: 30, hp: 60, speed: 0, atk: 0, range: 0, color: "#f1c40f" },
            light: { cost: 40, hp: 110, speed: 110, atk: 18, range: 30, color: "#2ecc71" },
            heavy: { cost: 80, hp: 300, speed: 60, atk: 35, range: 35, color: "#3498db" },
            ranged: { cost: 60, hp: 85, speed: 90, atk: 15, range: 250, color: "#e67e22" },
            mage: { cost: 120, hp: 80, speed: 75, atk: 50, range: 300, color: "#9b59b6", aoe: 70 }
        };

        let gold, aiGold, units, bases, particles, projectiles, gameActive, lastTime = 0;
        let popups = [];

        class Popup {
            constructor(x, y, text, color) {
                this.x = x; this.y = y; this.text = text; this.color = color;
                this.life = 1.0;
            }
            update(dt) { this.y -= 30 * dt; this.life -= dt; }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.font = "bold 16px Arial";
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1;
            }
        }

        class Projectile {
            constructor(x, y, target, damage, color, isAoe, aoeRange) {
                this.x = x; this.y = y; this.target = target; this.damage = damage;
                this.color = color; this.isAoe = isAoe; this.aoeRange = aoeRange;
                this.speed = 400; this.dead = false;
            }
            update(dt) {
                let dx = this.target.x - this.x, dy = (GROUND() - 30) - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 10) {
                    this.dead = true;
                    if (this.isAoe) {
                        units.filter(u => u.side !== this.target.side && Math.abs(u.x - this.x) < this.aoeRange)
                            .forEach(u => u.takeDamage(this.damage));
                    } else { this.target.takeDamage(this.damage); }
                }
                this.x += (dx / dist) * this.speed * dt;
                this.y += (dy / dist) * this.speed * dt;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI * 2); ctx.fill();
            }
        }

        class Unit {
            constructor(type, side, x) {
                Object.assign(this, TYPES[type]);
                this.type = type; this.side = side; this.x = x;
                this.maxHp = this.hp; this.cool = 0; this.walk = 0; this.hitFlash = 0;
            }
            takeDamage(amt) {
                this.hp -= amt; this.hitFlash = 0.2;
                popups.push(new Popup(this.x, GROUND() - 60, "-" + Math.floor(amt), "#ff4444"));
            }
            update(dt) {
                if (this.hp <= 0) return;
                this.cool = Math.max(0, this.cool - dt);
                this.hitFlash = Math.max(0, this.hitFlash - dt);

                const enemy = units.find(u => u.side !== this.side && u.hp > 0 && Math.abs(u.x - this.x) < this.range);
                if (enemy) {
                    if (this.cool <= 0) this.attack(enemy);
                    return;
                }

                const base = bases.find(b => b.side !== this.side && b.hp > 0);
                if (base && Math.abs(base.x - this.x) > 40) {
                    this.x += Math.sign(base.x - this.x) * this.speed * dt;
                    this.walk += dt * 12;
                } else if (base && this.cool <= 0) {
                    this.attack(base);
                }
            }
            attack(target) {
                this.cool = 1.5;
                if (this.type === 'ranged' || this.type === 'mage') {
                    projectiles.push(new Projectile(this.x, GROUND() - 40, target, this.atk, this.color, this.type === 'mage', this.aoe));
                } else {
                    if (target.takeDamage) target.takeDamage(this.atk); else target.hp -= this.atk;
                    for (let i = 0; i < 5; i++) particles.push(new Particle(target.x, GROUND() - 20, "#fff"));
                }
            }
            draw() {
                const y = GROUND(), s = this.side;
                const bop = Math.sin(Date.now() / 200) * 2;
                const w = this.speed > 0 ? Math.sin(this.walk) * 12 : 0;

                ctx.save();
                ctx.translate(this.x, y);

                ctx.fillStyle = "rgba(0,0,0,0.15)";
                ctx.beginPath(); ctx.ellipse(0, 0, 15, 5, 0, 0, Math.PI * 2); ctx.fill();

                ctx.strokeStyle = this.hitFlash > 0 ? "#fff" : (s < 0 ? "#2ecc71" : "#e74c3c");
                ctx.lineWidth = 3; ctx.lineCap = "round";

                // Stick Figure
                ctx.beginPath();
                ctx.arc(0, -38 + bop, 7, 0, Math.PI * 2); // Head
                ctx.moveTo(0, -31 + bop); ctx.lineTo(0, -15); // Torso
                ctx.moveTo(0, -15); ctx.lineTo(w, 0); // Leg L
                ctx.moveTo(0, -15); ctx.lineTo(-w, 0); // Leg R
                ctx.stroke();

                // Weapon
                ctx.beginPath();
                ctx.strokeStyle = "#444";
                if (this.type === 'miner') { ctx.moveTo(0, -25); ctx.lineTo(s < 0 ? 15 : -15, -35 + Math.sin(this.walk) * 5); }
                else if (this.type === 'heavy') { ctx.lineWidth = 5; ctx.moveTo(0, -25); ctx.lineTo(s < 0 ? 20 : -20, -40); }
                else { ctx.moveTo(0, -25); ctx.lineTo(s < 0 ? 15 : -15, -25); }
                ctx.stroke();

                // HP Bar
                ctx.fillStyle = "#000"; ctx.fillRect(-15, -55, 30, 4);
                ctx.fillStyle = this.side < 0 ? "#2ecc71" : "#e74c3c";
                ctx.fillRect(-15, -55, 30 * (this.hp / this.maxHp), 4);
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.vx = (Math.random() - 0.5) * 8; this.vy = -Math.random() * 8;
                this.life = 1.0;
            }
            update(dt) { this.x += this.vx; this.y += this.vy; this.vy += 0.4; this.life -= dt * 1.5; }
            draw() {
                ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 3, 3); ctx.globalAlpha = 1;
            }
        }

        function spawn(t) {
            if (gold >= TYPES[t].cost) {
                gold -= TYPES[t].cost;
                const b = bases.filter(b => b.side < 0 && b.hp > 0).pop();
                units.push(new Unit(t, -1, b.x + 40));
            }
        }

        function resetGame() {
            gold = 200; aiGold = 200; units = []; particles = []; projectiles = []; popups = [];
            bases = [{ side: -1, x: 100, hp: 1200 }, { side: -1, x: 220, hp: 1200 }, { side: 1, x: c.width - 220, hp: 1200 }, { side: 1, x: c.width - 100, hp: 1200 }];
            gameActive = true; document.getElementById("game-over-screen").style.display = "none";
            lastTime = performance.now(); requestAnimationFrame(loop);
        }

        function loop(t) {
            if (!gameActive) return;
            const dt = Math.min((t - lastTime) / 1000, 0.1); lastTime = t;
            ctx.clearRect(0, 0, c.width, c.height);

            // --- DRAW CLOUDS (FIXED PATH ERROR) ---
            ctx.fillStyle = "rgba(255,255,255,0.2)";
            [[100, 80, 0.2], [400, 150, 0.5], [800, 100, 0.3]].forEach(cDat => {
                ctx.beginPath();
                let x = (cDat[0] + t * cDat[2] / 10) % (c.width + 100) - 50;
                ctx.arc(x, cDat[1], 30, 0, Math.PI * 2);
                ctx.arc(x + 25, cDat[1] - 10, 35, 0, Math.PI * 2);
                ctx.arc(x + 50, cDat[1], 30, 0, Math.PI * 2);
                ctx.fill();
            });

            // Ground
            ctx.fillStyle = "#1e392a"; ctx.fillRect(0, GROUND(), c.width, c.height);
            ctx.fillStyle = "#2ecc71"; ctx.fillRect(0, GROUND(), c.width, 5);

            // Economy
            gold += (1 + units.filter(u => u.side < 0 && u.type === 'miner').length) * 4 * dt;
            aiGold += (1 + units.filter(u => u.side > 0 && u.type === 'miner').length) * 4 * dt;
            document.getElementById("gold").innerText = "Gold: " + Math.floor(gold);

            // AI
            if (aiGold > 100 && Math.random() < dt * 0.5) {
                const types = Object.keys(TYPES);
                const type = types[Math.floor(Math.random() * types.length)];
                aiGold -= TYPES[type].cost;
                units.push(new Unit(type, 1, bases.find(b => b.side > 0 && b.hp > 0).x - 40));
            }

            // Render Everything
            bases.forEach(b => {
                if (b.hp <= 0) return;
                ctx.fillStyle = b.side < 0 ? "#27ae60" : "#c0392b";
                ctx.fillRect(b.x - 30, GROUND() - 80, 60, 80);
                ctx.fillStyle = "#000"; ctx.fillRect(b.x - 30, GROUND() - 95, 60, 6);
                ctx.fillStyle = "#2ecc71"; ctx.fillRect(b.x - 30, GROUND() - 95, 60 * (b.hp / 1200), 6);
            });

            units.forEach(u => u.update(dt));
            units.filter(u => u.hp <= 0).forEach(u => { for (let i = 0; i < 8; i++) particles.push(new Particle(u.x, GROUND() - 20, "#555")); });
            units = units.filter(u => u.hp > 0);
            units.forEach(u => u.draw());

            projectiles.forEach(p => p.update(dt));
            projectiles = projectiles.filter(p => !p.dead);
            projectiles.forEach(p => p.draw());

            particles.forEach(p => p.update(dt));
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => p.draw());

            popups.forEach(p => p.update(dt));
            popups = popups.filter(p => p.life > 0);
            popups.forEach(p => p.draw());

            // Win/Loss
            if (!bases.some(b => b.side > 0 && b.hp > 0)) endGame("VICTORY", "green");
            if (!bases.some(b => b.side < 0 && b.hp > 0)) endGame("DEFEAT", "red");

            requestAnimationFrame(loop);
        }

        function endGame(txt, col) {
            gameActive = false;
            const s = document.getElementById("game-over-screen");
            const t = document.getElementById("result-title");
            s.style.display = "flex"; t.innerText = txt; t.style.color = col;
        }

        resetGame();
    </script>
</body>

</html>
