<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Stick RTS – Turbo Edition</title>
    <style>
        html,
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        canvas {
            display: block;
            margin: auto;
            border-bottom: 5px solid #222;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            max-width: 100%;
            height: auto;
        }

        #ui {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 2px solid #444;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat {
            font-weight: bold;
            color: #ffd700;
            margin-right: 15px;
            font-size: 1.2rem;
            min-width: 120px;
        }

        button {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
        }

        button:hover {
            background: #444;
            transform: translateY(-3px);
            border-color: #ffd700;
        }

        button.upgrade {
            background: #333;
            border-color: #777;
        }

        button.upgrade:hover {
            border-color: #ff0;
        }

        #game-over-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <canvas id="c" width="1200" height="650"></canvas>
    <div id="ui">
        <div class="stat" id="gold">Gold: 0</div>
        <button onclick="spawn('miner')">Miner<br><span>30</span></button>
        <button onclick="spawn('light')">Light<br><span>40</span></button>
        <button onclick="spawn('heavy')">Heavy<br><span>80</span></button>
        <button onclick="spawn('ranged')">Ranged<br><span>60</span></button>
        <button onclick="spawn('mage')">Mage<br><span>120</span></button>
        <button class="upgrade" onclick="upgrade('attack')">⚔ Atk+<br>Cost <span id="atkCost">200</span><br>Lvl <span
                id="atkLvl">0</span></button>
        <button class="upgrade" onclick="upgrade('defense')">🛡 Def+<br>Cost <span id="defCost">250</span><br>Lvl <span
                id="defLvl">0</span></button>
        <button class="upgrade" onclick="upgrade('speed')">🏃 Spd+<br>Cost <span id="spdCost">150</span><br>Lvl <span
                id="spdLvl">0</span></button>
    </div>
    <div id="game-over-screen">
        <h1 id="result-title" style="font-size: 5rem;"></h1>
        <button onclick="resetGame()" style="font-size: 2rem;">PLAY AGAIN</button>
    </div>

    <script>
        const c = document.getElementById("c"), ctx = c.getContext("2d");
        const GROUND = () => c.height * 0.75;
        const TYPES = {
            miner: { cost: 30, hp: 60, speed: 0, atk: 0, range: 0, color: "#f1c40f" },
            light: { cost: 40, hp: 110, speed: 110, atk: 18, range: 30, color: "#2ecc71" },
            heavy: { cost: 80, hp: 300, speed: 60, atk: 35, range: 35, color: "#3498db" },
            ranged: { cost: 60, hp: 85, speed: 90, atk: 15, range: 250, color: "#e67e22" },
            mage: { cost: 120, hp: 80, speed: 75, atk: 50, range: 300, color: "#9b59b6", aoe: 70 }
        };

        let gold, aiGold, units, bases, particles, projectiles, gameActive, lastTime = 0;
        let popups = [];
        let attackLevel = 0, defenseLevel = 0, speedLevel = 0;

        class Popup {
            constructor(x, y, text, color) {
                this.x = x; this.y = y; this.text = text; this.color = color;
                this.life = 1.0;
            }
            update(dt) { this.y -= 30 * dt; this.life -= dt; }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.font = "bold 16px Arial";
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1;
            }
        }

        class Projectile {
            constructor(x, y, target, damage, color, isAoe, aoeRange, projType = "default") {
                this.x = x; this.y = y; this.target = target; this.damage = damage;
                this.color = color; this.isAoe = isAoe; this.aoeRange = aoeRange || 0;
                this.speed = 400; this.dead = false;
                this.projType = projType;
                this.trail = [];
                this.homing = projType !== "arrow";

                if (projType === "arrow") {
                    let dx = target.x - x;
                    let dy = (GROUND() - 30) - y;
                    let dist = Math.hypot(dx, dy) || 1;
                    this.vx = (dx / dist) * this.speed;
                    this.vy = (dy / dist) * this.speed;
                }
            }
            hit() {
                this.dead = true;
                if (this.target.takeDamage) this.target.takeDamage(this.damage);
                else this.target.hp -= this.damage;

                if (this.isAoe) {
                    units.filter(u => u.side !== this.target.side && Math.hypot(u.x - this.x, (GROUND() - 30) - this.y) < this.aoeRange)
                        .forEach(u => u.takeDamage(this.damage));

                    for (let i = 0; i < 35; i++) {
                        let ang = Math.random() * Math.PI * 2;
                        let force = Math.random() * 120 + 60;
                        let p = new Particle(this.x, this.y, "#ffd700");
                        p.vx = Math.cos(ang) * force;
                        p.vy = Math.sin(ang) * force - 100;
                        particles.push(p);
                    }
                }
            }
            update(dt) {
                if (this.dead) return;

                if (this.homing) {
                    let dx = this.target.x - this.x;
                    let dy = (GROUND() - 30) - this.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < 10) { this.hit(); return; }
                    let dirX = dx / dist;
                    let dirY = dy / dist;
                    this.x += dirX * this.speed * dt;
                    this.y += dirY * this.speed * dt;
                } else {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    let dx = this.target.x - this.x;
                    let dy = (GROUND() - 30) - this.y;
                    if (Math.hypot(dx, dy) < 10) { this.hit(); }
                }

                if (this.projType === "fireball") {
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 18) this.trail.shift();
                }
            }
            draw() {
                if (this.projType === "arrow") {
                    let angle = Math.atan2(this.vy, this.vx);
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(angle);
                    ctx.fillStyle = "#8B4513";
                    ctx.fillRect(-14, -1.5, 28, 3);
                    ctx.fillStyle = "#555";
                    ctx.beginPath();
                    ctx.moveTo(14, 0);
                    ctx.lineTo(7, -8);
                    ctx.lineTo(7, 8);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = "#fe9";
                    ctx.fillRect(-14, -5, 10, 10);
                    ctx.restore();
                } else if (this.projType === "fireball") {
                    ctx.fillStyle = "#f60";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 9, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 0.7;
                    ctx.fillStyle = "#fff";
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;

                    for (let i = 0; i < this.trail.length; i++) {
                        let tp = this.trail[i];
                        let alpha = (i / this.trail.length) * 0.8;
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = "#ffd700";
                        ctx.beginPath();
                        ctx.arc(tp.x, tp.y, 12 - i * 0.6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.vx = (Math.random() - 0.5) * 100;
                this.vy = -Math.random() * 120;
                this.life = 1.0;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += 400 * dt;
                this.life -= dt * 1.5;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
                ctx.globalAlpha = 1;
            }
        }

        class Unit {
            constructor(type, side, x) {
                Object.assign(this, TYPES[type]);
                this.type = type; this.side = side; this.x = x;
                this.atk = TYPES[type].atk * (1 + 0.25 * attackLevel);
                this.hp = TYPES[type].hp * (1 + 0.25 * defenseLevel);
                this.maxHp = this.hp;
                if (this.speed > 0) this.speed = TYPES[type].speed * (1 + 0.2 * speedLevel);
                this.cool = 0; this.walk = 0; this.hitFlash = 0;
                this.attackAnim = 0;
            }
            takeDamage(amt) {
                this.hp -= amt; this.hitFlash = 0.2;
                popups.push(new Popup(this.x, GROUND() - 60, "-" + Math.floor(amt), "#ff4444"));
                for (let i = 0; i < 8; i++) {
                    particles.push(new Particle(this.x, GROUND() - 30, "#fff"));
                }
            }
            update(dt) {
                if (this.hp <= 0) return;
                this.cool = Math.max(0, this.cool - dt);
                this.hitFlash = Math.max(0, this.hitFlash - dt);
                const animDecay = (this.type === 'heavy' ? 1.2 : this.type === 'light' ? 4 : 2.5);
                this.attackAnim = Math.max(0, this.attackAnim - dt * animDecay);

                const enemy = units.find(u => u.side !== this.side && u.hp > 0 && Math.abs(u.x - this.x) < this.range);
                if (enemy) {
                    if (this.cool <= 0) this.attack(enemy);
                    return;
                }

                const base = bases.find(b => b.side !== this.side && b.hp > 0);
                if (base && Math.abs(base.x - this.x) > 40) {
                    this.x += Math.sign(base.x - this.x) * this.speed * dt;
                    this.walk += dt * 12;
                } else if (base && this.cool <= 0) {
                    this.attack(base);
                }
            }
            attack(target) {
                this.cool = 1.5;
                this.attackAnim = 1.0;

                if (this.type === "ranged") {
                    projectiles.push(new Projectile(this.x, GROUND() - 40, target, this.atk, this.color, false, 0, "arrow"));
                } else if (this.type === "mage") {
                    projectiles.push(new Projectile(this.x, GROUND() - 40, target, this.atk, this.color, true, this.aoe, "fireball"));
                    // cast effect
                    for (let i = 0; i < 20; i++) {
                        let p = new Particle(this.x + (Math.random() - 0.5) * 20, GROUND() - 80, this.color);
                        p.vy = -Math.random() * 200 - 100;
                        p.vx += (Math.random() - 0.5) * 100;
                        p.life = 0.8;
                        particles.push(p);
                    }
                } else {
                    if (target.takeDamage) target.takeDamage(this.atk);
                    else target.hp -= this.atk;
                    for (let i = 0; i < 15; i++) {
                        let ang = Math.random() * Math.PI * 2;
                        particles.push(new Particle(target.x + Math.cos(ang) * 15, GROUND() - 20 + Math.sin(ang) * 15, "#fff"));
                    }
                }
            }
            draw() {
                const y = GROUND();
                const bop = Math.sin(Date.now() / 200 + this.x * 0.01) * 3;
                const walkSwing = this.speed > 0 ? Math.sin(this.walk) * 15 : 0;
                const armSwing = this.speed > 0 ? -Math.sin(this.walk) * 10 : 0;

                ctx.save();
                ctx.translate(this.x, y);
                const dir = this.side < 0 ? 1 : -1;
                ctx.scale(dir, 1);

                // shadow
                ctx.fillStyle = "rgba(0,0,0,0.2)";
                ctx.beginPath();
                ctx.ellipse(0, 0, 20, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // hit flash
                if (this.hitFlash > 0) {
                    ctx.globalAlpha = 0.4;
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(-25, -90, 50, 90);
                    ctx.globalAlpha = 1;
                }

                // body outline
                ctx.strokeStyle = this.side < 0 ? "#2ecc71" : "#e74c3c";
                ctx.lineWidth = 3;
                ctx.lineCap = "round";

                // head
                ctx.beginPath();
                ctx.arc(0, -38 + bop, 8, 0, Math.PI * 2);
                ctx.stroke();

                // torso
                ctx.beginPath();
                ctx.moveTo(0, -30 + bop);
                ctx.lineTo(0, -10);
                ctx.stroke();

                // legs
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(walkSwing, 10);
                ctx.moveTo(0, -10);
                ctx.lineTo(-walkSwing, 10);
                ctx.stroke();

                // arms (non-weapon arm)
                ctx.beginPath();
                ctx.moveTo(0, -25 + bop);
                ctx.lineTo(-12 - armSwing, -12);
                ctx.stroke();

                // weapon arm will be drawn with weapon

                const attackSwing = Math.sin(this.attackAnim * Math.PI) * 70; // smooth swing arc

                // weapons
                if (this.type === "miner") {
                    ctx.strokeStyle = "#777";
                    ctx.lineWidth = 4;
                    let swing = Math.sin(this.walk * 2) * 10 + attackSwing * 0.6;
                    ctx.beginPath();
                    ctx.moveTo(12 + armSwing, -25 + bop);
                    ctx.lineTo(28 + swing, -45 + bop);
                    ctx.stroke();
                    // pick head
                    ctx.fillStyle = "#555";
                    ctx.beginPath();
                    ctx.moveTo(28 + swing, -45 + bop);
                    ctx.lineTo(42 + swing, -55 + bop);
                    ctx.lineTo(42 + swing, -35 + bop);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type === "light") {
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = "#654";
                    let swing = armSwing + attackSwing;
                    ctx.beginPath();
                    ctx.moveTo(12 + armSwing, -25 + bop);
                    ctx.lineTo(20 + swing * 0.4, -35 + swing * 0.8);
                    ctx.stroke();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "#ddd";
                    ctx.beginPath();
                    ctx.moveTo(20 + swing * 0.4, -35 + swing * 0.8);
                    ctx.lineTo(48 + swing, -35 + swing * 1.1);
                    ctx.stroke();
                } else if (this.type === "heavy") {
                    ctx.lineWidth = 8;
                    ctx.strokeStyle = "#444";
                    let swing = attackSwing * 1.4 + Math.sin(this.walk) * 5;
                    ctx.beginPath();
                    ctx.moveTo(0, -20 + bop);
                    ctx.lineTo(40 + swing, -60 + swing / 2);
                    ctx.stroke();
                    ctx.fillStyle = "#666";
                    ctx.beginPath();
                    ctx.moveTo(40 + swing, -60 + swing / 2);
                    ctx.lineTo(58 + swing, -78 + swing / 2);
                    ctx.lineTo(58 + swing, -42 + swing / 2);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.type === "ranged") {
                    const pull = this.attackAnim * 45;
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = "#8B4513";
                    ctx.beginPath();
                    ctx.moveTo(-5, -60 + bop);
                    ctx.quadraticCurveTo(40 - pull, -40 + bop, -5, -20 + bop);
                    ctx.stroke();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "#543";
                    ctx.beginPath();
                    ctx.moveTo(-5, -60 + bop);
                    ctx.lineTo(5 - pull, -40 + bop);
                    ctx.lineTo(-5, -20 + bop);
                    ctx.stroke();
                    // arrow nocked when pulling
                    if (this.attackAnim > 0.1) {
                        ctx.save();
                        ctx.translate(5 - pull, -40 + bop);
                        ctx.rotate(Math.PI / 4);
                        ctx.fillStyle = "#8B4513";
                        ctx.fillRect(-10, -1, 20, 2);
                        ctx.restore();
                    }
                } else if (this.type === "mage") {
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = "#654";
                    ctx.beginPath();
                    ctx.moveTo(0, -25 + bop);
                    ctx.lineTo(0, -80 + bop);
                    ctx.stroke();
                    const glowSize = 12 + this.attackAnim * 20;
                    const pulse = Math.sin(this.attackAnim * 20) * 3;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, -85 + bop, glowSize + pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 0.8;
                    ctx.fillStyle = "#fff";
                    ctx.arc(0, -85 + bop, (glowSize + pulse) / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                // HP bar
                const ratio = this.hp / this.maxHp;
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#000";
                ctx.strokeRect(-18, -60, 36, 6);
                ctx.fillStyle = "#333";
                ctx.fillRect(-18, -60, 36, 6);
                ctx.fillStyle = this.side < 0 ? "#2ecc71" : "#e74c3c";
                ctx.fillRect(-18, -60, 36 * ratio, 6);

                ctx.restore();
            }
        }

        function spawn(t) {
            if (gold >= TYPES[t].cost) {
                gold -= TYPES[t].cost;
                const b = bases.find(b => b.side < 0 && b.hp > 0);
                if (b) units.push(new Unit(t, -1, b.x + 40));
            }
        }

        function upgrade(type) {
            let level, baseCost;
            if (type === 'attack') { level = attackLevel; baseCost = 200; }
            else if (type === 'defense') { level = defenseLevel; baseCost = 250; }
            else if (type === 'speed') { level = speedLevel; baseCost = 150; }

            const cost = Math.floor(baseCost * Math.pow(1.7, level));
            if (gold >= cost) {
                gold -= cost;
                if (type === 'attack') attackLevel++;
                else if (type === 'defense') defenseLevel++;
                else if (type === 'speed') speedLevel++;
                updateUpgradeUI();
            }
        }

        function updateUpgradeUI() {
            document.getElementById('atkCost').innerText = Math.floor(200 * Math.pow(1.7, attackLevel));
            document.getElementById('atkLvl').innerText = attackLevel;
            document.getElementById('defCost').innerText = Math.floor(250 * Math.pow(1.7, defenseLevel));
            document.getElementById('defLvl').innerText = defenseLevel;
            document.getElementById('spdCost').innerText = Math.floor(150 * Math.pow(1.7, speedLevel));
            document.getElementById('spdLvl').innerText = speedLevel;
        }

        function resetGame() {
            gold = 200; aiGold = 200; units = []; particles = []; projectiles = []; popups = [];
            attackLevel = defenseLevel = speedLevel = 0;
            updateUpgradeUI();
            bases = [{ side: -1, x: 100, hp: 1200 }, { side: -1, x: 220, hp: 1200 }, { side: 1, x: c.width - 220, hp: 1200 }, { side: 1, x: c.width - 100, hp: 1200 }];
            gameActive = true;
            document.getElementById("game-over-screen").style.display = "none";
            lastTime = performance.now();
            requestAnimationFrame(loop);
        }

        function loop(t) {
            if (!gameActive) return;
            const dt = Math.min((t - lastTime) / 1000, 0.1);
            lastTime = t;
            ctx.clearRect(0, 0, c.width, c.height);

            // sun
            ctx.fillStyle = "#fdbb2d";
            ctx.beginPath();
            ctx.arc(c.width - 200, 120, 60, 0, Math.PI * 2);
            ctx.fill();

            // clouds
            ctx.fillStyle = "rgba(255,255,255,0.25)";
            [[100, 80, 0.15], [400, 140, 0.3], [800, 100, 0.2], [600, 60, 0.25], [200, 180, 0.1], [1000, 120, 0.35]].forEach(cDat => {
                ctx.beginPath();
                let x = (cDat[0] + t * cDat[2] / 10) % (c.width + 200) - 100;
                ctx.arc(x, cDat[1], 35, 0, Math.PI * 2);
                ctx.arc(x + 30, cDat[1] - 15, 40, 0, Math.PI * 2);
                ctx.arc(x + 60, cDat[1], 35, 0, Math.PI * 2);
                ctx.fill();
            });

            // ground
            ctx.fillStyle = "#1e392a";
            ctx.fillRect(0, GROUND(), c.width, c.height - GROUND());
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(0, GROUND(), c.width, 8);

            // economy
            const playerMiners = units.filter(u => u.side < 0 && u.type === "miner").length;
            gold += (1 + playerMiners) * 4 * dt;
            const aiMiners = units.filter(u => u.side > 0 && u.type === "miner").length;
            aiGold += (1 + aiMiners) * 4 * dt;
            document.getElementById("gold").innerText = "Gold: " + Math.floor(gold);

            // AI
            if (aiGold >= 30) {
                const weights = {
                    miner: aiMiners < 3 ? 25 : aiMiners < 6 ? 10 : 4,
                    light: 6,
                    heavy: 5,
                    ranged: 6,
                    mage: 5
                };
                const available = Object.keys(TYPES).filter(t => aiGold >= TYPES[t].cost);
                if (available.length > 0 && Math.random() < dt * 1.6) {
                    let total = 0;
                    for (let t of available) total += weights[t] || 3;
                    let r = Math.random() * total;
                    let cum = 0;
                    let chosen;
                    for (let t of available) {
                        cum += weights[t] || 3;
                        if (r < cum) { chosen = t; break; }
                    }
                    if (chosen) {
                        aiGold -= TYPES[chosen].cost;
                        const b = bases.find(b => b.side > 0 && b.hp > 0);
                        if (b) units.push(new Unit(chosen, 1, b.x - 40));
                    }
                }
            }

            // bases
            bases.forEach(b => {
                if (b.hp <= 0) return;
                ctx.save();
                ctx.translate(b.x, GROUND());
                const dir = b.side < 0 ? 1 : -1;
                ctx.scale(dir, 1);
                const color = b.side < 0 ? "#27ae60" : "#c0392b";
                ctx.fillStyle = color;
                ctx.fillRect(-40, -100, 80, 100);
                ctx.fillStyle = "#555";
                ctx.fillRect(-15, -150, 30, 60);
                ctx.beginPath();
                ctx.moveTo(-20, -150);
                ctx.lineTo(0, -175);
                ctx.lineTo(20, -150);
                ctx.fillStyle = color;
                ctx.fill();
                const wave = Math.sin(Date.now() / 300 + b.x) * 8;
                ctx.fillStyle = b.side < 0 ? "#2ecc71" : "#e74c3c";
                ctx.beginPath();
                ctx.moveTo(0, -175);
                ctx.lineTo(35 + wave, -165);
                ctx.lineTo(35 + wave, -145);
                ctx.lineTo(0, -155);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                // base HP
                const ratio = b.hp / 1200;
                ctx.fillStyle = "#000";
                ctx.fillRect(b.x - 45, GROUND() - 115, 90, 10);
                ctx.fillStyle = b.side < 0 ? "#2ecc71" : "#e74c3c";
                ctx.fillRect(b.x - 45, GROUND() - 115, 90 * ratio, 10);
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x - 45, GROUND() - 115, 90, 10);
            });

            units.forEach(u => u.update(dt));
            units = units.filter(u => {
                if (u.hp <= 0) {
                    for (let i = 0; i < 20; i++) {
                        let p = new Particle(u.x + (Math.random() - 0.5) * 30, GROUND() - 20 + Math.random() * 20, "#888");
                        p.vy = -Math.random() * 200;
                        particles.push(p);
                    }
                    return false;
                }
                return true;
            });
            units.forEach(u => u.draw());

            projectiles.forEach(p => p.update(dt));
            projectiles = projectiles.filter(p => !p.dead);
            projectiles.forEach(p => p.draw());

            particles.forEach(p => p.update(dt));
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => p.draw());

            popups.forEach(p => p.update(dt));
            popups = popups.filter(p => p.life > 0);
            popups.forEach(p => p.draw());

            if (!bases.some(b => b.side > 0 && b.hp > 0)) endGame("VICTORY", "#2ecc71");
            if (!bases.some(b => b.side < 0 && b.hp > 0)) endGame("DEFEAT", "#e74c3c");

            requestAnimationFrame(loop);
        }

        function endGame(txt, col) {
            gameActive = false;
            document.getElementById("game-over-screen").style.display = "flex";
            document.getElementById("result-title").innerText = txt;
            document.getElementById("result-title").style.color = col;
        }

        resetGame();
    </script>
</body>

</html>
